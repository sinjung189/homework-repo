<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fetchPost(url) {
            fetch(url) // URL 요청 보내는 Promise 반환
            .then(response =>  {
                if(!response.ok) {
                    throw  new Error (`HTTP error : ${response.status}`);  // throw 순간 catch 이동
                }
                return response.json()  // 에러가 아니면 JS 객체 파싱 >>  객체로 바꾸어라 
            })
            .then ( data => {
                console.log(`성공:`,data)  // 파싱 성공 시 
            })
            .catch(error => {
                console.error (`실패:`,error.message); // 실패시 에러 메시지 출력
            })
        }
        
        
        //성공 케이스 
        fetchPost('https://jsonplaceholder.typicode.com/posts/1');

        // 실패 케이스 실행 (404)
        fetchPost('https://jsonplaceholder.typicode.com/posts/9999');



        // JSON + 에러 부분 다시 공부...throw 순간부분
    </script>
</body>
</html>
